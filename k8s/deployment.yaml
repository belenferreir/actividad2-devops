apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-notas-deployment
spec:
  selector:
    matchLabels:
      app: notas
  replicas: 3
  template:
    metadata:
      labels:
        app: notas
    spec:
      containers:
      - name: notas
        image: api-notas:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: api-notas-config-v1
